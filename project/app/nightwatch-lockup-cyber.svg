<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 62" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="nwTitle">
  <title id="nwTitle">NQ NIGHTWATCH — MARKET TRUTH TERMINAL</title>
  <defs>
    <linearGradient id="nwWire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fe6c8"/>
      <stop offset="0.55" stop-color="#7ef7e2"/>
      <stop offset="1" stop-color="#ff8ac4"/>
    </linearGradient>
    <linearGradient id="nwWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef7e2"/>
      <stop offset="0.58" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ff8ac4"/>
    </linearGradient>
    <linearGradient id="nwScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef7e2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ef7e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ef7e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="nwGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nwSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nwMarkClip"><path d="M31 4 L54 16.5 L54 45.5 L31 58 L8 45.5 L8 16.5 Z"/></clipPath>
  </defs>

  <!-- ==== GLYPH: hex sentinel over a candle spine ==== -->
  <g filter="url(#nwGlow)">
    <path d="M31 4 L54 16.5 L54 45.5 L31 58 L8 45.5 L8 16.5 Z"
          fill="none" stroke="url(#nwWire)" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M31 10 L49 20 L49 42 L31 52 L13 42 L13 20 Z"
          fill="rgba(47,230,200,.08)" stroke="rgba(126,247,226,.45)" stroke-width=".7"/>
  </g>

  <g clip-path="url(#nwMarkClip)">
    <g stroke="rgba(126,247,226,.32)" stroke-width=".65" fill="none">
      <path d="M8 25 H19 L23 21 H31"/>
      <path d="M54 41 H43 L39 45 H31"/>
      <path d="M8 48 H16 L20 44"/>
      <path d="M54 14 H46 L42 18"/>
    </g>
    <circle cx="19" cy="25" r="1.25" fill="#2fe6c8"/>
    <circle cx="43" cy="41" r="1.25" fill="#ff8ac4"/>

    <!-- candle spine: the market truth core -->
    <g filter="url(#nwSoft)">
      <line x1="31" y1="12" x2="31" y2="50" stroke="rgba(233,217,174,.5)" stroke-width="1"/>
      <rect x="27.2" y="18" width="7.6" height="12" rx="1" fill="#2fe6c8" fill-opacity=".88"/>
      <rect x="27.2" y="34" width="7.6" height="10" rx="1" fill="#ff5d6e" fill-opacity=".88"/>
    </g>

    <rect x="8" y="0" width="46" height="8" fill="url(#nwScan)" opacity=".6">
      <animate attributeName="y" values="6;54;6" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g stroke="#7ef7e2" stroke-width="1.2" stroke-opacity=".85" fill="none">
    <path d="M8 14 V9 M8 9 H13"/>
    <path d="M54 48 V53 M54 53 H49"/>
  </g>

  <!-- ==== WORDMARK ==== -->
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="67.4" y="29" font-size="21.5" font-weight="700" letter-spacing="2.2"
          fill="#ff5d6e" fill-opacity=".32">NIGHTWATCH</text>
    <text x="68.6" y="29" font-size="21.5" font-weight="700" letter-spacing="2.2"
          fill="#2fe6c8" fill-opacity=".28">NIGHTWATCH</text>
    <text x="68" y="29" font-size="21.5" font-weight="700" letter-spacing="2.2"
          fill="url(#nwWord)" filter="url(#nwSoft)">NIGHTWATCH</text>

    <!-- NQ chip -->
    <rect x="68" y="38" width="26.5" height="14.5" rx="2"
          fill="rgba(47,230,200,.14)" stroke="#2fe6c8" stroke-opacity=".8" stroke-width=".9"/>
    <text x="81.2" y="48.6" font-size="10" font-weight="700" letter-spacing="1.3"
          text-anchor="middle" fill="#7ef7e2">NQ</text>

    <text x="101" y="48.6" font-size="9.6" font-weight="600" letter-spacing="1.5"
          fill="#9fb3ae">MARKET TRUTH TERMINAL</text>
  </g>

  <!-- baseline rule with live node -->
  <g>
    <line x1="68" y1="56.5" x2="286" y2="56.5" stroke="rgba(126,247,226,.26)" stroke-width="1"/>
    <circle cx="68" cy="56.5" r="2" fill="#2fe6c8">
      <animate attributeName="fill-opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="286" cy="56.5" r="1.5" fill="#ff8ac4" fill-opacity=".85"/>
  </g>
</svg>
