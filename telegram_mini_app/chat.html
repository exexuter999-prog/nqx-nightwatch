<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer">
    <title>NQX // CLAUDE</title>
    <style>
      /* 本体の styles.css は読まない。この面は独立して軽くしておく。 */
      :root {
        --bg: #0b0c0e;
        --panel: #14161a;
        --bone: #c9c5ba;
        --muted: #8f8b81;
        --acid: #ff3b4f;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--bone);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid #1e2128;
      }
      h1 { margin: 0; font-size: 12px; letter-spacing: .18em; }
      #status { margin-left: auto; font-size: 10px; color: var(--muted); }
      #status.is-bad { color: var(--acid); }
      #log { flex: 1; overflow-y: auto; padding: 12px; display: flex;
             flex-direction: column; gap: 10px; }
      .msg { max-width: 88%; padding: 8px 10px; border-radius: 10px;
             background: var(--panel); font-size: 13px; line-height: 1.6; }
      .msg.is-user { align-self: flex-end; background: #1d2027; }
      .msg-who { font-size: 9px; color: var(--muted); margin-bottom: 4px;
                 letter-spacing: .08em; }
      .msg-body { white-space: pre-wrap; word-break: break-word; }
      form { display: flex; gap: 8px; padding: 10px 12px;
             border-top: 1px solid #1e2128; }
      input {
        flex: 1; min-width: 0; padding: 10px; border-radius: 8px;
        border: 1px solid #262a33; background: #101216; color: var(--bone);
        font-family: var(--mono); font-size: 13px;
      }
      input:focus { outline: none; border-color: #3a4050; }
      button {
        padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer;
        background: var(--acid); color: #0b0c0e; font-family: var(--mono);
        font-size: 12px; letter-spacing: .1em;
      }
      button:disabled { opacity: .5; cursor: default; }
      footer { padding: 0 12px 10px; font-size: 9px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>NQX // CLAUDE</h1>
      <span id="status">無期限停止</span>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" autocomplete="off"
             placeholder="受信箱は無期限停止中" maxlength="4000" disabled />
      <button type="submit" disabled>停止中</button>
    </form>
    <footer>受信箱は監視・分析・自動発注の判定経路から切り離されています。</footer>
    <script type="module" src="./chat.js"></script>
  </body>
</html>
