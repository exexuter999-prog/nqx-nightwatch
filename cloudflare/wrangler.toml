name = "nqx-nightwatch-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# --- 秘密でない設定 ---------------------------------------------------------
# 秘密と個人・口座の識別子は wrangler secret put で入れる。ここには絶対に書かない。
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put NQX_PUBLISH_SECRET
#   wrangler secret put NQX_LAUNCH_SECRET
#   wrangler secret put NQX_ALLOWED_USER_ID       # Telegram の数値 user id(2026-09-15 に vars から移動)
#   wrangler secret put NQX_AUTOTRADE_ACCOUNTS    # CrossTrade 口座 ID の CSV(同上)
# 後ろ 2 つは `python setup_cloudflare.py --sync-secrets` が .secrets/telegram.env と
# .secrets/crosstrade.env から投入する。ローカル `wrangler dev` 用の値は cloudflare/.dev.vars
# (git 管理外)に置く。
#
# NQX_AUTOTRADE_ACCOUNTS はローカルの CROSSTRADE_ACCOUNTS と**必ず同じ集合**にする。ズレると
# autotrade_arm が "account scope changed since arming" で武装を自動失効させ、Mini App で AUTO を
# 何度 ON にしても新規 ENTRY が出ない(2026-08-27 実測)。
#   ★ .secrets/crosstrade.env の CROSSTRADE_ACCOUNTS を動かしたら**同時に** --sync-secrets を叩く。
#     secret だけ古いと上の警告どおり AUTO が永久に武装できない。
# 口座の入替履歴(封印・評価通過)は TRADING_CONTEXT.md §1 に残す。ここには書かない。
[vars]
NQX_ACCOUNT_ID = "lucid-50k-daily"
NQX_SYMBOL = "MNQU6"
NQX_ALLOWED_ORIGIN = "https://nqx-nightwatch.pages.dev"
NQX_AUTOTRADE_MINUTES = "420"                            # AUTO ON から7時間
NQX_AUTOTRADE_MAX_MINUTES = "720"                        # 連続武装の絶対上限

# --- Durable Object ---------------------------------------------------------
[[durable_objects.bindings]]
name = "NIGHTWATCH"
class_name = "NightwatchState"

# SQLite-backed DO。transactionSync と sql.exec を使うのでこの migration が必須。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NightwatchState"]

[observability]
enabled = true
